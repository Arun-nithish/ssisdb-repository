<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSISDB Dashboard (sample data)</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d9e0e6;--ok:#1f8a70;--bad:#c8452d;--run:#d9a21b;--blue:#3b5b8c}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e6edf3;--mute:#93a1ad;--line:#2a3743;--ok:#3fb594;--bad:#e8664e;--run:#e6b43a;--blue:#7ea0d6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0}header span{color:var(--mute)}
main{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:0 24px 28px;max-width:1200px;margin:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;min-width:0}
h2{font-size:14px;margin:0 0 10px;font-weight:600}
.k{grid-column:span 3}.k b{display:block;font-size:30px;font-weight:600;letter-spacing:-.5px}.k small{color:var(--mute)}
.w6{grid-column:span 6}.w12{grid-column:span 12}
@media(max-width:800px){.k{grid-column:span 6}.w6{grid-column:span 12}}
svg{width:100%;height:auto;display:block}text{fill:var(--mute);font-size:11px}
.row{display:grid;grid-template-columns:150px 1fr 56px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:10px;background:var(--blue);border-radius:2px}.row em{font-style:normal;color:var(--mute);text-align:right}
select{font:inherit;padding:3px 6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500}
.tw{overflow-x:auto}.pill{padding:1px 8px;border-radius:10px;color:#fff;font-size:12px}
</style></head><body>
<header><h1>SSISDB Dashboard</h1><span>Sample data, last 14 days. Replace with your Power BI report.</span></header>
<main>
<section class="k"><small>Executions</small><b id="k1"></b></section>
<section class="k"><small>Success rate</small><b id="k2"></b></section>
<section class="k"><small>Avg duration</small><b id="k3"></b></section>
<section class="k"><small>Errors</small><b id="k4"></b></section>
<section class="w6"><h2>Executions per day</h2><svg id="days" viewBox="0 0 520 220" role="img" aria-label="Executions per day by status"></svg></section>
<section class="w6"><h2>Slowest packages (avg minutes)</h2><div id="top"></div></section>
<section class="w12"><h2>Execution timeline <select id="sel" aria-label="Execution"></select></h2><svg id="gantt" viewBox="0 0 1000 230" role="img" aria-label="Task timeline"></svg></section>
<section class="w12"><h2>Recent errors</h2><div class="tw"><table><thead><tr><th>Time</th><th>Package</th><th>Task</th><th>Code</th><th>Message</th></tr></thead><tbody id="err"></tbody></table></div></section>
</main>
<script>
let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
const pk=[["Master_Nightly",42],["Fact_Sales",28],["Fact_Inventory",19],["Dim_Customer",9],["Dim_Product",6],["Stage_Orders",14],["PostProcess_Cube",11]];
const ex=[];let id=9000;
for(let d=13;d>=0;d--)for(let i=0;i<6;i++){const p=pk[Math.floor(r()*pk.length)],q=r();
ex.push({id:++id,day:d,pkg:p[0],min:p[1]*(0.7+r()*.7),st:q<.08?"Failed":q<.12?"Canceled":"Succeeded"})}
const f=ex.filter(e=>e.st=="Failed"),ok=ex.filter(e=>e.st=="Succeeded").length;
k1.textContent=ex.length;k2.textContent=(ok/ex.length*100).toFixed(1)+"%";
k3.textContent=(ex.reduce((a,e)=>a+e.min,0)/ex.length).toFixed(1)+" min";k4.textContent=f.length;
const C={Succeeded:"var(--ok)",Failed:"var(--bad)",Canceled:"var(--run)"};
let h="";for(let d=13;d>=0;d--){const x=30+(13-d)*36;let y=190;
for(const st of["Succeeded","Canceled","Failed"]){const n=ex.filter(e=>e.day==d&&e.st==st).length,ht=n*24;
if(n){y-=ht;h+=`<rect x="${x}" y="${y}" width="26" height="${ht-1}" fill="${C[st]}"/>`}}
if(d%3==0)h+=`<text x="${x}" y="208">-${d}d</text>`}
days.innerHTML=h+`<text x="0" y="14">6</text><text x="0" y="190">0</text><text x="330" y="14" fill="${C.Succeeded}">Succeeded</text><text x="395" y="14" style="fill:var(--run)">Canceled</text><text x="455" y="14" style="fill:var(--bad)">Failed</text>`;
const avg=pk.map(p=>{const a=ex.filter(e=>e.pkg==p[0]);return[p[0],a.reduce((t,e)=>t+e.min,0)/a.length]}).sort((a,b)=>b[1]-a[1]);
top.innerHTML=avg.map(a=>`<div class="row"><span>${a[0]}</span><div><div class="bar" style="width:${a[1]/avg[0][1]*100}%"></div></div><em>${a[1].toFixed(1)}</em></div>`).join("");
sel.innerHTML=ex.filter(e=>e.day<3).map(e=>`<option value="${e.id}">#${e.id} ${e.pkg} (${e.st})</option>`).join("");
const steps=["Truncate staging","Load Orders","Load Customers","Merge Dimensions","Load Facts","Refresh Cube"];
function gantt(){const e=ex.find(x=>x.id==sel.value);let t=0,h="",tot=0;const rows=steps.map((n,i)=>{const dur=1+r()*5,o={n,s:i%3==1?t-dur*.6:t,d:dur};t=o.s+dur;tot=Math.max(tot,t);return o});
rows.forEach((o,i)=>{const y=14+i*34,x=190+o.s/tot*780,w=o.d/tot*780,bad=e.st=="Failed"&&i==rows.length-2;
h+=`<text x="0" y="${y+14}">${o.n}</text><rect x="${x}" y="${y}" width="${w}" height="20" rx="2" fill="${bad?"var(--bad)":"var(--blue)"}"/><text x="${x+w+6}" y="${y+14}">${o.d.toFixed(1)}m</text>`});
gantt_.innerHTML=h}
const gantt_=document.getElementById("gantt");sel.onchange=gantt;gantt();
const msgs=[["0xC0202009","OLE DB Destination","Cannot insert duplicate key in object dbo.FactSales."],["0xC0047062","Load Customers","Login timeout expired on source connection."],["0xC020901C","Load Orders","Column 'Qty' cannot convert between unicode and non-unicode types."]];
err.innerHTML=f.slice(-6).reverse().map((e,i)=>{const m=msgs[i%3];return`<tr><td>${14-e.day>0?"-"+e.day+"d":"today"}</td><td>${e.pkg}</td><td>${m[1]}</td><td>${m[0]}</td><td>${m[2]}</td></tr>`}).join("");
</script></body></html>
